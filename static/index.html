<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>医疗导诊助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 700px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
            padding: 24px 28px;
            text-align: center;
        }
        .header h1 { font-size: 24px; margin-bottom: 6px; }
        .header p { font-size: 14px; opacity: 0.85; }
        .chat-area {
            height: 400px;
            overflow-y: auto;
            padding: 20px 24px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat-area::-webkit-scrollbar { width: 6px; }
        .chat-area::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
        .msg {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .msg.user {
            align-self: flex-end;
            background: #4facfe;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.assistant {
            align-self: flex-start;
            background: #fff;
            border: 1px solid #e8e8e8;
            border-bottom-left-radius: 4px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .input-area {
            display: flex;
            gap: 10px;
            padding: 16px 24px;
            border-top: 1px solid #eee;
            background: #fff;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-area input:focus { border-color: #4facfe; }
        .input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        .input-area button:hover { opacity: 0.9; }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
        .loading { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 24px;
            background: #f0f4ff;
            border-top: 1px solid #e0e8ff;
        }
        .examples span { font-size: 12px; color: #888; }
        .example-tag {
            font-size: 12px;
            padding: 4px 10px;
            background: #fff;
            border: 1px solid #d0d8ff;
            border-radius: 20px;
            cursor: pointer;
            color: #5568d0;
            transition: all 0.2s;
        }
        .example-tag:hover { background: #4facfe; color: #fff; border-color: #4facfe; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>医疗导诊助手</h1>
            <p>描述您的症状，助手会帮您推荐合适的科室</p>
        </div>
        <div class="chat-area" id="chatArea">
            <div class="msg assistant">您好！我是医疗导诊助手，请描述您的症状（如头痛、发烧等），我将为您推荐合适的科室。</div>
        </div>
        <div class="examples" id="examples">
            <span>试试问：</span>
            <span class="example-tag" onclick="askExample(this)">头痛发烧挂什么科</span>
            <span class="example-tag" onclick="askExample(this)">皮肤红疹很痒</span>
            <span class="example-tag" onclick="askExample(this)">我身高170体重80公斤，最近头晕</span>
            <span class="example-tag" onclick="askExample(this)">胸痛呼吸困难</span>
        </div>
        <div class="input-area">
            <input id="questionInput" placeholder="请输入您的症状..." onkeydown="if(event.key==='Enter') askQuestion()" autofocus>
            <button id="sendBtn" onclick="askQuestion()">发送</button>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const input = document.getElementById('questionInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMsg(role, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.textContent = text;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function setLoading(loading) {
            sendBtn.disabled = loading;
            sendBtn.innerHTML = loading ? '<span class="loading"></span>思考中' : '发送';
            input.disabled = loading;
        }

        function askExample(el) {
            input.value = el.textContent;
            askQuestion();
        }

        async function askQuestion() {
            const question = input.value.trim();
            if (!question) return;
            addMsg('user', question);
            input.value = '';
            setLoading(true);
            try {
                const resp = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });
                const data = await resp.json();
                addMsg('assistant', data.answer);
            } catch (e) {
                addMsg('assistant', '抱歉，请求失败：' + e.message);
            }
            setLoading(false);
        }
    </script>
</body>
</html>
